<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrendPulse — Track Record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Companion surface to the dashboard — the same shadcn token architecture and
   the same opportunity scale, so a band means the same thing on both pages.
   Never gated: this is where the score is audited. */
:root{
  --background:0 0% 100%;--foreground:222.2 84% 4.9%;
  --card:0 0% 100%;--card-foreground:222.2 84% 4.9%;
  --primary:160 84% 30%;--primary-foreground:0 0% 100%;
  --secondary:210 40% 96.1%;--muted:210 40% 96.1%;--muted-foreground:215.4 16.3% 46.9%;
  --accent:210 40% 96.1%;--accent-foreground:222.2 47.4% 11.2%;
  --destructive:0 72% 45%;--border:214.3 31.8% 91.4%;--input:214.3 31.8% 91.4%;
  --ring:160 84% 30%;--radius:0.5rem;
  --opp-1:158 64% 34%;--opp-2:84 55% 34%;--opp-3:38 92% 38%;
  --opp-4:22 90% 45%;--opp-5:0 72% 48%;
  --up:158 64% 34%;--down:0 72% 48%;
  --sans:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --background:222.2 84% 4.9%;--foreground:210 40% 98%;
  --card:222.2 47% 8%;--card-foreground:210 40% 98%;
  --primary:158 64% 45%;--primary-foreground:158 90% 8%;
  --secondary:217.2 32.6% 17.5%;--muted:217.2 32.6% 17.5%;--muted-foreground:215 20.2% 65.1%;
  --accent:217.2 32.6% 17.5%;--accent-foreground:210 40% 98%;
  --destructive:0 72% 55%;--border:217.2 32.6% 17.5%;--input:217.2 32.6% 20%;
  --ring:158 64% 45%;
  --opp-1:158 64% 48%;--opp-2:84 62% 52%;--opp-3:43 96% 56%;
  --opp-4:25 95% 58%;--opp-5:0 84% 63%;
  --up:158 64% 48%;--down:0 84% 63%;}}
:root[data-theme="dark"]{
  --background:222.2 84% 4.9%;--foreground:210 40% 98%;
  --card:222.2 47% 8%;--card-foreground:210 40% 98%;
  --primary:158 64% 45%;--primary-foreground:158 90% 8%;
  --secondary:217.2 32.6% 17.5%;--muted:217.2 32.6% 17.5%;--muted-foreground:215 20.2% 65.1%;
  --accent:217.2 32.6% 17.5%;--accent-foreground:210 40% 98%;
  --destructive:0 72% 55%;--border:217.2 32.6% 17.5%;--input:217.2 32.6% 20%;
  --ring:158 64% 45%;
  --opp-1:158 64% 48%;--opp-2:84 62% 52%;--opp-3:43 96% 56%;
  --opp-4:25 95% 58%;--opp-5:0 84% 63%;
  --up:158 64% 48%;--down:0 84% 63%;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:hsl(var(--background));color:hsl(var(--foreground));
     font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.num,table{font-variant-numeric:tabular-nums}
a{color:hsl(var(--primary));text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:4px}
:focus-visible{outline:none;box-shadow:0 0 0 2px hsl(var(--background)),0 0 0 4px hsl(var(--ring));
               border-radius:calc(var(--radius) - 2px)}
.topbar{height:56px;border-bottom:1px solid hsl(var(--border));display:flex;
        align-items:center;gap:14px;padding:0 20px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;
       letter-spacing:-.015em}
.brand .mark{width:22px;height:22px;border-radius:calc(var(--radius) - 2px);
             background:linear-gradient(140deg,hsl(var(--opp-1)),hsl(var(--opp-2)))}
.topbar a.back{margin-left:auto;color:hsl(var(--muted-foreground));font-weight:500;font-size:14px}
.topbar a.back:hover{color:hsl(var(--foreground));text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 72px}
h1{font-size:26px;font-weight:700;letter-spacing:-.03em;margin-bottom:6px}
.sub{color:hsl(var(--muted-foreground));font-size:14px;max-width:78ch;margin-bottom:22px}
h2{font-size:15px;font-weight:600;margin:30px 0 12px;letter-spacing:-.015em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:16px}
.stat{background:hsl(var(--card));border:1px solid hsl(var(--border));
      border-radius:var(--radius);padding:16px 18px;box-shadow:0 1px 2px 0 rgb(0 0 0 /.05)}
.stat b{display:block;font-size:26px;font-weight:700;letter-spacing:-.03em;
        line-height:1.15;margin-bottom:5px}
.stat span{color:hsl(var(--muted-foreground));font-size:13px}
.callout{background:hsl(var(--card));border:1px solid hsl(var(--border));
         border-radius:var(--radius);padding:16px 18px;font-size:14px;line-height:1.6;
         color:hsl(var(--muted-foreground));margin:16px 0;max-width:82ch;
         box-shadow:0 1px 2px 0 rgb(0 0 0 /.05)}
.callout b,.callout strong{color:hsl(var(--foreground));font-weight:600}
.callout.warn{border-color:hsl(var(--opp-3)/.5);background:hsl(var(--opp-3)/.08)}
.tblwrap{background:hsl(var(--card));border:1px solid hsl(var(--border));
         border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 2px 0 rgb(0 0 0 /.05)}
table{width:100%;border-collapse:collapse}
th{color:hsl(var(--muted-foreground));font-size:13px;font-weight:500;text-align:left;
   padding:11px 16px;border-bottom:1px solid hsl(var(--border));white-space:nowrap;height:44px}
td{padding:12px 16px;border-bottom:1px solid hsl(var(--border));font-size:14px}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:hsl(var(--muted)/.5)}
.num{text-align:right}
th.num{text-align:right}
.muted{color:hsl(var(--muted-foreground))}
.up{color:hsl(var(--up));font-weight:600}
.down{color:hsl(var(--down));font-weight:600}
.bdot{width:8px;height:8px;border-radius:9999px;display:inline-block;
      margin-right:8px;vertical-align:0}
.scroll{overflow-x:auto}
.loading,.error{padding:52px;text-align:center;color:hsl(var(--muted-foreground));font-size:14px}
code{background:hsl(var(--muted));border-radius:calc(var(--radius) - 4px);
     padding:2px 6px;font:400 13px var(--mono)}
.colophon{margin-top:30px;padding-top:20px;border-top:1px solid hsl(var(--border));
          font-size:13px;color:hsl(var(--muted-foreground))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="mark"></span>TrendPulse</div>
  <a class="back" href="/">← Back to trends</a>
</header>
<div class="wrap">
  <h1>Track record</h1>
  <div class="sub">What the score said, and what actually happened next — published in
    full, including where it fails. This page is never gated.</div>
  <div id="content"><div class="loading">Loading…</div></div>
</div>
  <div class="colophon">TrendPulse — measured accuracy, never gated</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function pct(v) { return v == null ? '—' : v + '%'; }

function bandRows(perf) {
  if (!perf || !perf.length) return '<tr><td colspan="4" class="muted">No data.</td></tr>';
  return perf.map((p, i) => `
    <tr>
      <td><span class="bdot" style="background:hsl(var(--opp-${Math.min(5, i + 1)}))"></span>
          <span style="font-weight:600;color:hsl(var(--opp-${Math.min(5, i + 1)}))">${esc(p.label)}</span>
          <span class="muted">≥${p.min}</span></td>
      <td class="num">${p.n}</td>
      <td class="num">${pct(p.hit_rate)}</td>
      <td class="num muted">${p.median_change ?? '—'}</td>
    </tr>`).join('');
}

function diagnosticRows(diag) {
  if (!diag) return '';
  return Object.entries(diag).map(([field, d]) => {
    const rho = d.correlation;
    const cls = rho == null ? 'muted' : (rho > 0.05 ? 'up' : (rho < -0.05 ? 'down' : 'muted'));
    const verdict = rho == null ? 'no variance in the data'
                  : (rho > 0.05 ? 'predictive' : (rho < -0.05 ? 'inversely related' : 'no signal'));
    return `<tr>
      <td><code>${esc(field)}</code><div class="muted" style="font-size:13px">${esc(d.description)}</div></td>
      <td class="num ${cls}">${rho == null ? '—' : rho}</td>
      <td class="num muted">${d.n}</td>
      <td class="${cls}">${verdict}</td>
    </tr>`;
  }).join('');
}

function trackRows(rows) {
  if (!rows || !rows.length)
    return '<tr><td colspan="5" class="muted">No qualifying calls yet.</td></tr>';
  return rows.map(r => `
    <tr>
      <td>${esc(r.keyword)}</td>
      <td class="muted">${esc(r.category || '—')}</td>
      <td class="muted">${esc(r.flagged_on)}</td>
      <td class="num">${r.score_at_flag}</td>
      <td class="num up">+${Math.round(r.change_pct)}</td>
    </tr>`).join('');
}

async function load() {
  let data;
  try {
    const res = await fetch('/api/track-record');
    data = await res.json();
    if (!data.ok) throw new Error(data.error || 'No calibration data yet.');
  } catch (err) {
    $('content').innerHTML =
      `<div class="error"><strong>Could not load track record.</strong><br>${esc(err.message)}
       <p class="muted">Run <code>python scripts/calibrate.py</code> to generate it.</p></div>`;
    return;
  }

  const uo = data.user_outcomes || {};
  const warn = data.warning
    ? `<div class="callout warn"><strong>Accuracy caveat.</strong> ${esc(data.warning)}</div>` : '';

  $('content').innerHTML = `
    <div class="stats">
      <div class="stat"><b>${data.sample_size}</b><span>Backtest sample</span></div>
      <div class="stat"><b>${pct(data.overall_hit_rate)}</b><span>Overall hit rate</span></div>
      <div class="stat"><b>${data.horizon_days}d</b><span>Forward horizon</span></div>
      <div class="stat"><b>${data.history_days}</b><span>Days of history</span></div>
      <div class="stat"><b>${data.score_separates_outcomes ? 'Yes' : 'No'}</b>
        <span>Score predicts demand</span></div>
    </div>

    ${warn}

    <div class="callout info">
      <strong>How this is measured.</strong> ${esc(data.notes || '')}
      Keywords whose interest index was below ${data.min_base} at the start are excluded
      (${data.dropped_low_base} dropped) because a move from 1 to 3 on a 0–100 index
      reads as +200% and would dominate the result.
    </div>

    <h2>Accuracy by score band</h2>
    <div class="scroll tblwrap"><table>
      <tr><th>Band</th><th class="num">Keywords</th><th class="num">Hit rate</th>
          <th class="num">Median change</th></tr>
      ${bandRows(data.band_performance)}
    </table></div>

    <h2>Which inputs actually predict demand</h2>
    <p class="sub">Rank correlation between each input and forward demand movement.
       Positive means the input helps; negative means it is actively hurting the score.</p>
    <div class="scroll tblwrap"><table>
      <tr><th>Input</th><th class="num">Correlation</th><th class="num">n</th><th>Verdict</th></tr>
      ${diagnosticRows(data.factor_diagnostics)}
    </table></div>

    <h2>Calls that worked</h2>
    <p class="sub">Keywords scored 50+ whose demand subsequently rose.</p>
    <div class="scroll tblwrap"><table>
      <tr><th>Keyword</th><th>Category</th><th>Flagged</th>
          <th class="num">Score</th><th class="num">Change</th></tr>
      ${trackRows(data.track_record)}
    </table></div>

    <h2>Real launch outcomes</h2>
    ${uo.available
      ? `<div class="stats">
           <div class="stat"><b>${uo.rows}</b><span>Outcomes logged</span></div>
           <div class="stat"><b>${uo.scored_rows}</b><span>With a score attached</span></div>
           <div class="stat"><b>${pct(uo.hit_rate)}</b><span>Reported success rate</span></div>
         </div>`
      : `<div class="callout info">No user-reported outcomes yet.
           ${esc(uo.reason || '')} Once people log what they launched and how it went,
           the score can be trained against revenue rather than search interest —
           the one input a competitor cannot copy.</div>`}

    <p class="sub" style="margin-top:30px">Generated ${esc(data.generated)}.</p>`;
}
load();
</script>
</body>
</html>
