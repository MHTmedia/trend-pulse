<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrendPulse — Track Record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Companion surface to the dashboard — same tokens, same components.
   Never gated: this is where the score is audited. */
:root{
  --bg:#111113;--panel:#18181b;--panel-2:#1f1f23;--hover:#ffffff08;
  --border:#26262b;--border-2:#33333b;--border-3:#43434d;
  --text:#eeeef0;--text-2:#b4b4bb;--text-3:#7d7d86;
  --accent:#5b5bd6;--accent-hi:#6e6ade;--accent-soft:#1f1f37;--accent-line:#3a3a80;
  --up:#30a46c;--down:#e5484d;--warn:#ffb224;--warn-soft:#3a2606;
  --b1:#30a46c;--b2:#9bbf3d;--b3:#ffb224;--b4:#f76b15;--b5:#e5484d;
  --r:6px;--r-lg:8px;
  --sans:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#fcfcfd;--panel:#fff;--panel-2:#f7f7f9;--hover:#00000005;
  --border:#e6e6ea;--border-2:#d9d9e0;--border-3:#c4c4cd;
  --text:#1c1c1f;--text-2:#5c5c66;--text-3:#8b8b94;
  --accent-hi:#4a4ac4;--accent-soft:#f1f1fe;--accent-line:#c9c9f5;
  --up:#218358;--down:#ce2c31;--warn:#a15c00;--warn-soft:#fff3e0;
  --b1:#218358;--b2:#5d8a1e;--b3:#a15c00;--b4:#cc4e00;--b5:#ce2c31;}}
:root[data-theme="light"]{
  --bg:#fcfcfd;--panel:#fff;--panel-2:#f7f7f9;--hover:#00000005;
  --border:#e6e6ea;--border-2:#d9d9e0;--border-3:#c4c4cd;
  --text:#1c1c1f;--text-2:#5c5c66;--text-3:#8b8b94;
  --accent-hi:#4a4ac4;--accent-soft:#f1f1fe;--accent-line:#c9c9f5;
  --up:#218358;--down:#ce2c31;--warn:#a15c00;--warn-soft:#fff3e0;
  --b1:#218358;--b2:#5d8a1e;--b3:#a15c00;--b4:#cc4e00;--b5:#ce2c31;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:400 13px/1.5 var(--sans);
     -webkit-font-smoothing:antialiased}
.num,table{font-variant-numeric:tabular-nums}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:3px}
.topbar{height:52px;border-bottom:1px solid var(--border);display:flex;align-items:center;
        gap:14px;padding:0 16px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13px;
       letter-spacing:-.012em;color:var(--text)}
.brand .mark{width:20px;height:20px;border-radius:var(--r);
             background:linear-gradient(140deg,var(--accent),#9d9df0)}
.topbar a.back{margin-left:auto;color:var(--text-2);font-weight:500}
.topbar a.back:hover{color:var(--text);text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:22px 16px 64px}
h1{font-size:21px;font-weight:600;letter-spacing:-.022em;margin-bottom:5px}
.sub{color:var(--text-2);font-size:13px;max-width:78ch;margin-bottom:18px}
h2{font-size:13px;font-weight:600;margin:26px 0 10px;letter-spacing:-.005em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);
      padding:13px 15px}
.stat b{display:block;font-size:21px;font-weight:600;letter-spacing:-.022em;
        line-height:1.1;margin-bottom:5px}
.stat span{color:var(--text-3);font-size:11px}
.callout{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);
         padding:13px 15px;font-size:13px;line-height:1.6;color:var(--text-2);
         margin:14px 0;max-width:82ch}
.callout b,.callout strong{color:var(--text);font-weight:500}
.callout.warn{border-color:var(--warn-soft);background:var(--warn-soft)}
.callout.info{border-color:var(--border-2)}
.tblwrap{background:var(--panel);border:1px solid var(--border);
         border-radius:var(--r-lg);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{color:var(--text-3);font-size:11px;font-weight:500;text-align:left;
   padding:9px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--hover)}
.num{text-align:right}
th.num{text-align:right}
.muted{color:var(--text-3)}
.up{color:var(--up);font-weight:500}
.down{color:var(--down);font-weight:500}
.scroll{overflow-x:auto}
.loading,.error{padding:48px;text-align:center;color:var(--text-3);font-size:13px}
code{background:var(--panel-2);border:1px solid var(--border);border-radius:4px;
     padding:1px 5px;font:400 11px var(--mono)}
.bdot{width:7px;height:7px;border-radius:2px;display:inline-block;
      margin-right:7px;vertical-align:0}
.colophon{margin-top:26px;padding-top:16px;border-top:1px solid var(--border);
          font-size:11px;color:var(--text-3)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="mark"></span>TrendPulse</div>
  <a class="back" href="/">← Back to trends</a>
</header>
<div class="wrap">
  <h1>Track record</h1>
  <div class="sub">What the score said, and what actually happened next — published in
    full, including where it fails. This page is never gated.</div>
  <div id="content"><div class="loading">Loading…</div></div>
</div>
  <div class="colophon">TrendPulse — measured accuracy, never gated</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function pct(v) { return v == null ? '—' : v + '%'; }

function bandRows(perf) {
  if (!perf || !perf.length) return '<tr><td colspan="4" class="muted">No data.</td></tr>';
  return perf.map((p, i) => `
    <tr>
      <td><span class="bdot" style="background:var(--b${Math.min(5, i + 1)})"></span>
          <span style="font-weight:600;color:var(--b${Math.min(5, i + 1)})">${esc(p.label)}</span>
          <span class="muted">≥${p.min}</span></td>
      <td class="num">${p.n}</td>
      <td class="num">${pct(p.hit_rate)}</td>
      <td class="num muted">${p.median_change ?? '—'}</td>
    </tr>`).join('');
}

function diagnosticRows(diag) {
  if (!diag) return '';
  return Object.entries(diag).map(([field, d]) => {
    const rho = d.correlation;
    const cls = rho == null ? 'muted' : (rho > 0.05 ? 'up' : (rho < -0.05 ? 'down' : 'muted'));
    const verdict = rho == null ? 'no variance in the data'
                  : (rho > 0.05 ? 'predictive' : (rho < -0.05 ? 'inversely related' : 'no signal'));
    return `<tr>
      <td><code>${esc(field)}</code><div class="muted" style="font-size:13px">${esc(d.description)}</div></td>
      <td class="num ${cls}">${rho == null ? '—' : rho}</td>
      <td class="num muted">${d.n}</td>
      <td class="${cls}">${verdict}</td>
    </tr>`;
  }).join('');
}

function trackRows(rows) {
  if (!rows || !rows.length)
    return '<tr><td colspan="5" class="muted">No qualifying calls yet.</td></tr>';
  return rows.map(r => `
    <tr>
      <td>${esc(r.keyword)}</td>
      <td class="muted">${esc(r.category || '—')}</td>
      <td class="muted">${esc(r.flagged_on)}</td>
      <td class="num">${r.score_at_flag}</td>
      <td class="num up">+${Math.round(r.change_pct)}</td>
    </tr>`).join('');
}

async function load() {
  let data;
  try {
    const res = await fetch('/api/track-record');
    data = await res.json();
    if (!data.ok) throw new Error(data.error || 'No calibration data yet.');
  } catch (err) {
    $('content').innerHTML =
      `<div class="error"><strong>Could not load track record.</strong><br>${esc(err.message)}
       <p class="muted">Run <code>python scripts/calibrate.py</code> to generate it.</p></div>`;
    return;
  }

  const uo = data.user_outcomes || {};
  const warn = data.warning
    ? `<div class="callout warn"><strong>Accuracy caveat.</strong> ${esc(data.warning)}</div>` : '';

  $('content').innerHTML = `
    <div class="stats">
      <div class="stat"><b>${data.sample_size}</b><span>Backtest sample</span></div>
      <div class="stat"><b>${pct(data.overall_hit_rate)}</b><span>Overall hit rate</span></div>
      <div class="stat"><b>${data.horizon_days}d</b><span>Forward horizon</span></div>
      <div class="stat"><b>${data.history_days}</b><span>Days of history</span></div>
      <div class="stat"><b>${data.score_separates_outcomes ? 'Yes' : 'No'}</b>
        <span>Score predicts demand</span></div>
    </div>

    ${warn}

    <div class="callout info">
      <strong>How this is measured.</strong> ${esc(data.notes || '')}
      Keywords whose interest index was below ${data.min_base} at the start are excluded
      (${data.dropped_low_base} dropped) because a move from 1 to 3 on a 0–100 index
      reads as +200% and would dominate the result.
    </div>

    <h2>Accuracy by score band</h2>
    <div class="scroll tblwrap"><table>
      <tr><th>Band</th><th class="num">Keywords</th><th class="num">Hit rate</th>
          <th class="num">Median change</th></tr>
      ${bandRows(data.band_performance)}
    </table></div>

    <h2>Which inputs actually predict demand</h2>
    <p class="sub">Rank correlation between each input and forward demand movement.
       Positive means the input helps; negative means it is actively hurting the score.</p>
    <div class="scroll tblwrap"><table>
      <tr><th>Input</th><th class="num">Correlation</th><th class="num">n</th><th>Verdict</th></tr>
      ${diagnosticRows(data.factor_diagnostics)}
    </table></div>

    <h2>Calls that worked</h2>
    <p class="sub">Keywords scored 50+ whose demand subsequently rose.</p>
    <div class="scroll tblwrap"><table>
      <tr><th>Keyword</th><th>Category</th><th>Flagged</th>
          <th class="num">Score</th><th class="num">Change</th></tr>
      ${trackRows(data.track_record)}
    </table></div>

    <h2>Real launch outcomes</h2>
    ${uo.available
      ? `<div class="stats">
           <div class="stat"><b>${uo.rows}</b><span>Outcomes logged</span></div>
           <div class="stat"><b>${uo.scored_rows}</b><span>With a score attached</span></div>
           <div class="stat"><b>${pct(uo.hit_rate)}</b><span>Reported success rate</span></div>
         </div>`
      : `<div class="callout info">No user-reported outcomes yet.
           ${esc(uo.reason || '')} Once people log what they launched and how it went,
           the score can be trained against revenue rather than search interest —
           the one input a competitor cannot copy.</div>`}

    <p class="sub" style="margin-top:30px">Generated ${esc(data.generated)}.</p>`;
}
load();
</script>
</body>
</html>
