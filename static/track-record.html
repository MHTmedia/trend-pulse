<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrendPulse — Track Record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Companion document to the main series — same sheet, same rules, same faces.
   This page is deliberately never gated: it is where the score is audited. */
:root {
  --desk:#e8e8e4; --sheet:#fff; --sheet-sunk:#f4f4f1;
  --ink:#14161a; --ink-2:#4a4e57; --ink-3:#767b85;
  --rule:#d8d8d3; --rule-strong:#14161a;
  --accent:#23417e; --accent-soft:#e7ecf6;
  --up:#1c6046; --down:#8f2f2f; --warn:#8a6d1f;
  --shadow:0 1px 2px rgba(20,22,26,.05), 0 8px 24px -12px rgba(20,22,26,.18);
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --sans:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --desk:#0c0d10; --sheet:#17191d; --sheet-sunk:#1e2126;
  --ink:#e8e7e3; --ink-2:#a8aab0; --ink-3:#7e828a;
  --rule:#2c2f35; --rule-strong:#e8e7e3;
  --accent:#8fb0ea; --accent-soft:#1d2635;
  --up:#5fbf90; --down:#e08a8a; --warn:#d6b45c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6); } }
:root[data-theme="dark"] {
  --desk:#0c0d10; --sheet:#17191d; --sheet-sunk:#1e2126;
  --ink:#e8e7e3; --ink-2:#a8aab0; --ink-3:#7e828a;
  --rule:#2c2f35; --rule-strong:#e8e7e3;
  --accent:#8fb0ea; --accent-soft:#1d2635;
  --up:#5fbf90; --down:#e08a8a; --warn:#d6b45c; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--desk); color:var(--ink); font:16px/1.55 var(--serif);
       -webkit-font-smoothing:antialiased; }
.num,table,code { font-variant-numeric:tabular-nums lining-nums; }
a { color:var(--accent); text-underline-offset:2px; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.wrap { max-width:900px; margin:0 auto; background:var(--sheet); min-height:100vh;
        border-left:1px solid var(--rule); border-right:1px solid var(--rule);
        box-shadow:var(--shadow); padding:0 clamp(18px,4vw,52px); }
header { padding:26px 0 0; border-bottom:2px solid var(--rule-strong);
         display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; }
h1 { font:700 clamp(28px,4vw,40px)/1.05 var(--serif); letter-spacing:-.022em; }
header .sub { font:italic 400 17px/1.4 var(--serif); color:var(--ink-2);
              flex-basis:100%; padding:8px 0 18px; max-width:62ch; }
header a { margin-left:auto; font:500 12.5px var(--sans); }
h2 { font:700 11.5px var(--sans); letter-spacing:.09em; text-transform:uppercase;
     margin:34px 0 10px; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
         gap:0; border-top:1px solid var(--rule-strong); margin-top:22px; }
.stat { border-bottom:1px solid var(--rule); border-right:1px solid var(--rule);
        padding:14px 16px; }
.stat b { display:block; font:700 30px/1 var(--serif); letter-spacing:-.02em;
          margin-bottom:5px; }
.stat span { color:var(--ink-3); font:600 10px var(--sans);
             text-transform:uppercase; letter-spacing:.09em; }
table { width:100%; border-collapse:collapse; font-family:var(--sans); }
th { color:var(--ink-3); font-size:10px; font-weight:600; text-transform:uppercase;
     letter-spacing:.085em; text-align:left; padding:0 12px 7px 0;
     border-bottom:1px solid var(--rule-strong); white-space:nowrap; }
td { padding:9px 12px 9px 0; border-bottom:1px solid var(--rule); font-size:13px; }
.num { text-align:right; padding-right:0; }
th.num { text-align:right; padding-right:0; }
.muted { color:var(--ink-3); }
.up { color:var(--up); font-weight:600; }
.down { color:var(--down); font-weight:600; }
.callout { font:400 15px/1.55 var(--serif); padding:14px 0 14px 16px; margin:18px 0;
           border-left:2px solid var(--rule-strong); max-width:70ch; }
.callout.warn { border-left-color:var(--warn); }
.callout.info { border-left-color:var(--accent); }
.scroll { overflow-x:auto; }
.loading,.error { padding:44px 0; text-align:center; color:var(--ink-3);
                  font-family:var(--sans); font-size:13px; }
code { background:var(--sheet-sunk); padding:1px 5px; font-size:12.5px;
       font-family:var(--sans); }
.colophon { font:500 11px var(--sans); letter-spacing:.05em; text-transform:uppercase;
            color:var(--ink-3); border-top:1px solid var(--rule);
            margin-top:34px; padding:14px 0 40px; }
@media (prefers-reduced-motion:reduce) { * { animation:none!important; transition:none!important } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Track Record</h1>
    <a href="/">← Back to the series</a>
    <div class="sub">What the score said, and what actually happened next — published
      in full, including where it fails.</div>
  </header>
  <div id="content"><div class="loading">Loading…</div></div>
</div>
  <div class="colophon">TrendPulse — measured accuracy, never gated</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function pct(v) { return v == null ? '—' : v + '%'; }

function bandRows(perf) {
  if (!perf || !perf.length) return '<tr><td colspan="4" class="muted">No data.</td></tr>';
  return perf.map(p => `
    <tr>
      <td><span style="font-weight:600">${esc(p.label)}</span>
          <span class="muted">≥${p.min}</span></td>
      <td class="num">${p.n}</td>
      <td class="num">${pct(p.hit_rate)}</td>
      <td class="num muted">${p.median_change ?? '—'}</td>
    </tr>`).join('');
}

function diagnosticRows(diag) {
  if (!diag) return '';
  return Object.entries(diag).map(([field, d]) => {
    const rho = d.correlation;
    const cls = rho == null ? 'muted' : (rho > 0.05 ? 'up' : (rho < -0.05 ? 'down' : 'muted'));
    const verdict = rho == null ? 'no variance in the data'
                  : (rho > 0.05 ? 'predictive' : (rho < -0.05 ? 'inversely related' : 'no signal'));
    return `<tr>
      <td><code>${esc(field)}</code><div class="muted" style="font-size:12px">${esc(d.description)}</div></td>
      <td class="num ${cls}">${rho == null ? '—' : rho}</td>
      <td class="num muted">${d.n}</td>
      <td class="${cls}">${verdict}</td>
    </tr>`;
  }).join('');
}

function trackRows(rows) {
  if (!rows || !rows.length)
    return '<tr><td colspan="5" class="muted">No qualifying calls yet.</td></tr>';
  return rows.map(r => `
    <tr>
      <td>${esc(r.keyword)}</td>
      <td class="muted">${esc(r.category || '—')}</td>
      <td class="muted">${esc(r.flagged_on)}</td>
      <td class="num">${r.score_at_flag}</td>
      <td class="num up">+${Math.round(r.change_pct)}</td>
    </tr>`).join('');
}

async function load() {
  let data;
  try {
    const res = await fetch('/api/track-record');
    data = await res.json();
    if (!data.ok) throw new Error(data.error || 'No calibration data yet.');
  } catch (err) {
    $('content').innerHTML =
      `<div class="error"><strong>Could not load track record.</strong><br>${esc(err.message)}
       <p class="muted">Run <code>python scripts/calibrate.py</code> to generate it.</p></div>`;
    return;
  }

  const uo = data.user_outcomes || {};
  const warn = data.warning
    ? `<div class="callout warn"><strong>Accuracy caveat.</strong> ${esc(data.warning)}</div>` : '';

  $('content').innerHTML = `
    <div class="stats">
      <div class="stat"><b>${data.sample_size}</b><span>Backtest sample</span></div>
      <div class="stat"><b>${pct(data.overall_hit_rate)}</b><span>Overall hit rate</span></div>
      <div class="stat"><b>${data.horizon_days}d</b><span>Forward horizon</span></div>
      <div class="stat"><b>${data.history_days}</b><span>Days of history</span></div>
      <div class="stat"><b>${data.score_separates_outcomes ? 'Yes' : 'No'}</b>
        <span>Score predicts demand</span></div>
    </div>

    ${warn}

    <div class="callout info">
      <strong>How this is measured.</strong> ${esc(data.notes || '')}
      Keywords whose interest index was below ${data.min_base} at the start are excluded
      (${data.dropped_low_base} dropped) because a move from 1 to 3 on a 0–100 index
      reads as +200% and would dominate the result.
    </div>

    <h2>Accuracy by score band</h2>
    <div class="scroll"><table>
      <tr><th>Band</th><th class="num">Keywords</th><th class="num">Hit rate</th>
          <th class="num">Median change</th></tr>
      ${bandRows(data.band_performance)}
    </table></div>

    <h2>Which inputs actually predict demand</h2>
    <p class="sub">Rank correlation between each input and forward demand movement.
       Positive means the input helps; negative means it is actively hurting the score.</p>
    <div class="scroll"><table>
      <tr><th>Input</th><th class="num">Correlation</th><th class="num">n</th><th>Verdict</th></tr>
      ${diagnosticRows(data.factor_diagnostics)}
    </table></div>

    <h2>Calls that worked</h2>
    <p class="sub">Keywords scored 50+ whose demand subsequently rose.</p>
    <div class="scroll"><table>
      <tr><th>Keyword</th><th>Category</th><th>Flagged</th>
          <th class="num">Score</th><th class="num">Change</th></tr>
      ${trackRows(data.track_record)}
    </table></div>

    <h2>Real launch outcomes</h2>
    ${uo.available
      ? `<div class="stats">
           <div class="stat"><b>${uo.rows}</b><span>Outcomes logged</span></div>
           <div class="stat"><b>${uo.scored_rows}</b><span>With a score attached</span></div>
           <div class="stat"><b>${pct(uo.hit_rate)}</b><span>Reported success rate</span></div>
         </div>`
      : `<div class="callout info">No user-reported outcomes yet.
           ${esc(uo.reason || '')} Once people log what they launched and how it went,
           the score can be trained against revenue rather than search interest —
           the one input a competitor cannot copy.</div>`}

    <p class="sub" style="margin-top:30px">Generated ${esc(data.generated)}.</p>`;
}
load();
</script>
</body>
</html>
