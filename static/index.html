<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrendPulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════════
   shadcn/ui design system, ported to plain CSS.

   Same token architecture as ui.shadcn.com — HSL triplets consumed through
   hsl(var(--token)), a single --radius that derives sm/md/lg, and the same
   component anatomy (Button variants, Card, Badge, Table, Dialog, Input, Tabs).
   No React and no Tailwind: this app has no build step, so the system is
   implemented directly rather than installed.

   One deliberate theming change: --primary is emerald rather than shadcn's
   neutral near-black. This product exists to surface opportunity, so the colour
   that means "act on this" is the same colour the top of the opportunity scale
   uses. The scale itself (--opp-1..5) runs emerald -> lime -> amber -> orange
   -> rose, and is the only thing allowed to use those hues.
   ═════════════════════════════════════════════════════════════════════════════ */
:root {
  --background: 0 0% 100%;
  --foreground: 222.2 84% 4.9%;
  --card: 0 0% 100%;
  --card-foreground: 222.2 84% 4.9%;
  --popover: 0 0% 100%;
  --popover-foreground: 222.2 84% 4.9%;
  --primary: 160 84% 30%;
  --primary-foreground: 0 0% 100%;
  --secondary: 210 40% 96.1%;
  --secondary-foreground: 222.2 47.4% 11.2%;
  --muted: 210 40% 96.1%;
  --muted-foreground: 215.4 16.3% 46.9%;
  --accent: 210 40% 96.1%;
  --accent-foreground: 222.2 47.4% 11.2%;
  --destructive: 0 72% 45%;
  --destructive-foreground: 0 0% 100%;
  --border: 214.3 31.8% 91.4%;
  --input: 214.3 31.8% 91.4%;
  --ring: 160 84% 30%;
  --radius: 0.5rem;

  /* Opportunity scale — high to low. The product's one evaluative judgement. */
  --opp-1: 158 64% 34%;   /* prime      */
  --opp-2:  84 55% 34%;   /* strong     */
  --opp-3:  38 92% 38%;   /* moderate   */
  --opp-4:  22 90% 45%;   /* thin       */
  --opp-5:   0 72% 48%;   /* poor       */
  --up: 158 64% 34%; --down: 0 72% 48%;

  /* Category identity — hue only, never evaluative. */
  --c1:0 72% 48%;   --c2:22 90% 45%;  --c3:38 92% 38%;  --c4:84 55% 34%;
  --c5:158 64% 34%; --c6:174 72% 32%; --c7:192 82% 35%; --c8:212 82% 45%;
  --c9:250 60% 55%; --c10:272 60% 50%; --c11:322 72% 45%; --c12:340 72% 48%;

  --sans:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --background: 222.2 84% 4.9%;
  --foreground: 210 40% 98%;
  --card: 222.2 47% 8%;
  --card-foreground: 210 40% 98%;
  --popover: 222.2 47% 8%;
  --popover-foreground: 210 40% 98%;
  --primary: 158 64% 45%;
  --primary-foreground: 158 90% 8%;
  --secondary: 217.2 32.6% 17.5%;
  --secondary-foreground: 210 40% 98%;
  --muted: 217.2 32.6% 17.5%;
  --muted-foreground: 215 20.2% 65.1%;
  --accent: 217.2 32.6% 17.5%;
  --accent-foreground: 210 40% 98%;
  --destructive: 0 72% 55%;
  --destructive-foreground: 210 40% 98%;
  --border: 217.2 32.6% 17.5%;
  --input: 217.2 32.6% 20%;
  --ring: 158 64% 45%;
  --opp-1:158 64% 48%; --opp-2:84 62% 52%; --opp-3:43 96% 56%;
  --opp-4:25 95% 58%;  --opp-5:0 84% 63%;
  --up:158 64% 48%; --down:0 84% 63%;
  --c1:0 84% 63%;   --c2:25 95% 58%;  --c3:43 96% 56%;  --c4:84 62% 52%;
  --c5:158 64% 48%; --c6:174 72% 50%; --c7:192 82% 55%; --c8:212 92% 62%;
  --c9:250 85% 72%; --c10:272 75% 68%; --c11:322 82% 62%; --c12:340 82% 65%;
} }
:root[data-theme="dark"] {
  --background: 222.2 84% 4.9%; --foreground: 210 40% 98%;
  --card: 222.2 47% 8%; --card-foreground: 210 40% 98%;
  --popover: 222.2 47% 8%; --popover-foreground: 210 40% 98%;
  --primary: 158 64% 45%; --primary-foreground: 158 90% 8%;
  --secondary: 217.2 32.6% 17.5%; --secondary-foreground: 210 40% 98%;
  --muted: 217.2 32.6% 17.5%; --muted-foreground: 215 20.2% 65.1%;
  --accent: 217.2 32.6% 17.5%; --accent-foreground: 210 40% 98%;
  --destructive: 0 72% 55%; --destructive-foreground: 210 40% 98%;
  --border: 217.2 32.6% 17.5%; --input: 217.2 32.6% 20%; --ring: 158 64% 45%;
  --opp-1:158 64% 48%; --opp-2:84 62% 52%; --opp-3:43 96% 56%;
  --opp-4:25 95% 58%;  --opp-5:0 84% 63%;
  --up:158 64% 48%; --down:0 84% 63%;
  --c1:0 84% 63%;   --c2:25 95% 58%;  --c3:43 96% 56%;  --c4:84 62% 52%;
  --c5:158 64% 48%; --c6:174 72% 50%; --c7:192 82% 55%; --c8:212 92% 62%;
  --c9:250 85% 72%; --c10:272 75% 68%; --c11:322 82% 62%; --c12:340 82% 65%;
}

*{box-sizing:border-box;margin:0;padding:0;border-color:hsl(var(--border))}
html{-webkit-text-size-adjust:100%}
body{background:hsl(var(--background));color:hsl(var(--foreground));
     font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
.num,table,input,select,button{font-variant-numeric:tabular-nums}
a{color:hsl(var(--primary));text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:4px}
::selection{background:hsl(var(--primary)/.22)}
:focus-visible{outline:none;box-shadow:0 0 0 2px hsl(var(--background)),0 0 0 4px hsl(var(--ring));
               border-radius:calc(var(--radius) - 2px)}
svg{display:block}
.icon{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;
      stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:hsl(var(--muted-foreground))}

/* ═══ TOP BAR ════════════════════════════════════════════════════════════════ */
.topbar{height:56px;border-bottom:1px solid hsl(var(--border));display:flex;
        align-items:center;gap:4px;padding:0 20px;position:sticky;top:0;z-index:40;
        background:hsl(var(--background)/.9);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;
       letter-spacing:-.015em;margin-right:18px;white-space:nowrap}
.brand .mark{width:22px;height:22px;border-radius:calc(var(--radius) - 2px);
             background:linear-gradient(140deg,hsl(var(--opp-1)),hsl(var(--opp-2)));flex:none}
.tnav{display:flex;gap:2px;align-items:center}
.tnav a,.tnav button{color:hsl(var(--muted-foreground));font:500 14px var(--sans);
        background:none;border:0;padding:7px 12px;border-radius:calc(var(--radius) - 2px);
        cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.tnav a:hover,.tnav button:hover{background:hsl(var(--accent));
        color:hsl(var(--accent-foreground));text-decoration:none}
.tnav a.on{color:hsl(var(--foreground))}
.tright{margin-left:auto;display:flex;align-items:center;gap:8px}
@media (max-width:860px){ .topbar{height:auto;flex-wrap:wrap;padding:10px 14px;gap:8px}
  .tnav{order:3;flex-basis:100%} }

.page{max-width:1440px;margin:0 auto;padding:24px 20px 72px}

/* ═══ CARD ═══════════════════════════════════════════════════════════════════ */
.card,.panel,.stat,.entry,.notice{background:hsl(var(--card));
  color:hsl(var(--card-foreground));border:1px solid hsl(var(--border));
  border-radius:var(--radius);box-shadow:0 1px 2px 0 rgb(0 0 0 / .05)}

/* ═══ NOTICE (Alert) ═════════════════════════════════════════════════════════ */
.notice{display:flex;gap:12px;align-items:center;padding:14px 16px;margin-bottom:16px;
        font-size:14px;color:hsl(var(--muted-foreground));line-height:1.5}
.notice .icon{color:hsl(var(--muted-foreground));width:16px;height:16px}
.notice b{color:hsl(var(--foreground));font-weight:600}
.notice .sp{margin-left:auto;display:flex;gap:10px;align-items:center;white-space:nowrap}
.notice.flagged{border-color:hsl(var(--opp-3)/.5);background:hsl(var(--opp-3)/.08)}
.notice.flagged .icon{color:hsl(var(--opp-3))}
@media (max-width:680px){ .notice{flex-wrap:wrap} .notice .sp{margin-left:0;width:100%} }

/* ═══ STAT CARDS ═════════════════════════════════════════════════════════════ */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat{padding:0}
.stat .sh{display:flex;align-items:center;justify-content:space-between;
          padding:16px 18px 0}
.stat span{font-size:13px;font-weight:500;color:hsl(var(--muted-foreground))}
.stat .badge-i{color:hsl(var(--muted-foreground))}
.stat .badge-i .icon{width:15px;height:15px}
.stat b{display:block;font-size:26px;font-weight:700;letter-spacing:-.03em;
        line-height:1.15;padding:6px 18px 4px}
.stat em{font-style:normal;font-size:12px;font-weight:400;
         color:hsl(var(--muted-foreground));display:block;padding:0 18px 16px}
@media (max-width:1000px){ .stats{grid-template-columns:repeat(2,1fr)} }

/* ═══ INPUT / SELECT ═════════════════════════════════════════════════════════ */
.search{display:flex;align-items:center;gap:8px;height:36px;
        border:1px solid hsl(var(--input));border-radius:calc(var(--radius) - 2px);
        background:transparent;padding:0 12px;flex:0 1 300px;min-width:190px}
.search:focus-within{box-shadow:0 0 0 2px hsl(var(--background)),0 0 0 4px hsl(var(--ring))}
.search .icon{color:hsl(var(--muted-foreground))}
.search input{border:0;outline:0;background:none;color:hsl(var(--foreground));
              font:400 14px var(--sans);width:100%;height:100%}
.search input::placeholder{color:hsl(var(--muted-foreground))}
select.sel{height:36px;font:400 14px var(--sans);color:hsl(var(--foreground));
           background:transparent;border:1px solid hsl(var(--input));
           border-radius:calc(var(--radius) - 2px);padding:0 10px;cursor:pointer}
select.sel:focus{outline:none;box-shadow:0 0 0 2px hsl(var(--background)),0 0 0 4px hsl(var(--ring))}
select.sel option{background:hsl(var(--popover));color:hsl(var(--popover-foreground))}

/* ═══ TABS (segmented) ═══════════════════════════════════════════════════════ */
.seg{display:inline-flex;height:36px;padding:4px;gap:2px;
     background:hsl(var(--muted));border-radius:calc(var(--radius) - 2px)}
.seg button{font:500 13px var(--sans);color:hsl(var(--muted-foreground));background:none;
            border:0;padding:0 12px;border-radius:calc(var(--radius) - 4px);cursor:pointer;
            display:flex;align-items:center;gap:6px}
.seg button.on{background:hsl(var(--background));color:hsl(var(--foreground));
               box-shadow:0 1px 2px 0 rgb(0 0 0 / .08)}
.seg .icon{width:13px;height:13px}

/* ═══ BADGE / LENS ═══════════════════════════════════════════════════════════ */
.toolbar{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.trow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lenses{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lens{font:500 12.5px var(--sans);color:hsl(var(--muted-foreground));
      background:transparent;border:1px solid hsl(var(--border));
      border-radius:9999px;padding:5px 12px;cursor:pointer;
      display:inline-flex;align-items:center;gap:6px}
.lens:hover{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}
.lens.on{background:hsl(var(--lc, var(--primary))/.14);
         border-color:hsl(var(--lc, var(--primary))/.45);
         color:hsl(var(--lc, var(--primary)))}
.lens .icon{width:12px;height:12px}
.count{margin-left:auto;font-size:13px;color:hsl(var(--muted-foreground));white-space:nowrap}
.linkbtn{background:none;border:0;color:hsl(var(--primary));font:500 13px var(--sans);
         cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:5px}
.linkbtn:hover{text-decoration:underline;text-underline-offset:4px}
.new{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.03em;
     color:hsl(var(--primary-foreground));background:hsl(var(--primary));
     border-radius:9999px;padding:1px 7px;margin-left:8px;vertical-align:1px}

/* ═══ TABLE ══════════════════════════════════════════════════════════════════ */
.panel{overflow:hidden}
.ptop{display:flex;align-items:center;gap:10px;padding:16px 18px;
      border-bottom:1px solid hsl(var(--border))}
.ptop h2{font-size:15px;font-weight:600;letter-spacing:-.015em}
.tag{font-size:12px;font-weight:500;color:hsl(var(--muted-foreground));
     border:1px solid hsl(var(--border));border-radius:9999px;padding:2px 9px;white-space:nowrap}
.pscroll{overflow-x:auto}
table.data{width:100%;border-collapse:collapse}
table.data th{font-size:13px;font-weight:500;color:hsl(var(--muted-foreground));
      text-align:right;padding:11px 16px;border-bottom:1px solid hsl(var(--border));
      white-space:nowrap;height:44px}
table.data th:nth-child(2),table.data td:nth-child(2){text-align:left}
table.data td{padding:12px 16px;border-bottom:1px solid hsl(var(--border));
      text-align:right;font-size:14px;vertical-align:middle}
table.data tbody tr:last-child td{border-bottom:0}
table.data tbody tr{cursor:pointer;transition:background .12s}
table.data tbody tr:hover td{background:hsl(var(--muted)/.5)}
.kw{font-weight:500;line-height:1.3}
.kw-sub{font-size:12.5px;color:hsl(var(--muted-foreground));margin-top:2px;
        display:flex;align-items:center}
.cdot{width:8px;height:8px;border-radius:9999px;display:inline-block;margin-right:7px;flex:none}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:500}
.delta .icon{width:12px;height:12px}
.up{color:hsl(var(--up))} .down{color:hsl(var(--down))}
.flat{color:hsl(var(--muted-foreground))}
.spark{width:76px;height:22px;margin-left:auto}
.spark path{fill:none;stroke-width:1.75;vector-effect:non-scaling-stroke}
.score{font-weight:600;font-size:15px}
.meter{display:inline-block;width:48px;height:6px;background:hsl(var(--muted));
       border-radius:9999px;vertical-align:middle;margin-left:10px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:9999px}
.locked{color:hsl(var(--muted-foreground));display:inline-flex;align-items:center;
        justify-content:flex-end;gap:4px}
.locked .icon{width:13px;height:13px}
.starcell{width:38px;text-align:left!important;padding-right:0!important}
.star{background:none;border:0;cursor:pointer;color:hsl(var(--muted-foreground));
      padding:4px;border-radius:calc(var(--radius) - 4px);display:flex}
.star:hover{color:hsl(var(--opp-3));background:hsl(var(--accent))}
.star.on{color:hsl(var(--opp-3))} .star.on .icon{fill:hsl(var(--opp-3))}
.growth-hot{color:hsl(var(--opp-4));font-weight:600}
.growth-break{color:hsl(var(--opp-1));font-weight:700}
@media (max-width:1000px){ .hide-md{display:none} }
@media (max-width:660px){ .hide-sm{display:none} }

/* ═══ ENTRY CARDS ════════════════════════════════════════════════════════════ */
.entries{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:16px}
.entry{padding:18px;cursor:pointer;position:relative;overflow:hidden;
       transition:box-shadow .15s,border-color .15s,transform .15s}
.entry::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;
               background:hsl(var(--cat, var(--primary)))}
.entry:hover{box-shadow:0 4px 14px -4px rgb(0 0 0 / .18);
             border-color:hsl(var(--cat, var(--border)));transform:translateY(-2px)}
.entry-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:2px}
.entry-top .kw{flex:1;font-size:15px;font-weight:600;letter-spacing:-.01em}
.entry-fig{margin:14px 0 12px;height:46px}
.entry-fig svg{width:100%;height:46px}
.entry dl{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:13px}
.entry dt{color:hsl(var(--muted-foreground))}
.entry dd{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}

/* ═══ BUTTON ═════════════════════════════════════════════════════════════════ */
.btn{font:500 14px var(--sans);height:36px;padding:0 16px;cursor:pointer;
     border:1px solid transparent;background:hsl(var(--secondary));
     color:hsl(var(--secondary-foreground));border-radius:calc(var(--radius) - 2px);
     display:inline-flex;align-items:center;justify-content:center;gap:8px;
     white-space:nowrap;transition:background .12s,box-shadow .12s}
.btn:hover{background:hsl(var(--secondary)/.75)}
.btn.pri{background:hsl(var(--primary));color:hsl(var(--primary-foreground))}
.btn.pri:hover{background:hsl(var(--primary)/.9)}
.btn.outline{background:transparent;border-color:hsl(var(--input));
             color:hsl(var(--foreground))}
.btn.outline:hover{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}
.btn.ghost{background:transparent;color:hsl(var(--foreground))}
.btn.ghost:hover{background:hsl(var(--accent))}
.btn[disabled]{opacity:.5;cursor:not-allowed;pointer-events:none}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn .icon{width:15px;height:15px}

/* ═══ DIALOG ═════════════════════════════════════════════════════════════════ */
dialog{border:0;padding:0;background:none;width:min(672px,94vw);margin:auto;
       color:hsl(var(--popover-foreground))}
dialog::backdrop{background:rgb(0 0 0 / .8)}
.dlg{background:hsl(var(--popover));border:1px solid hsl(var(--border));
     border-radius:var(--radius);box-shadow:0 24px 48px -12px rgb(0 0 0 / .45);
     max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.dlg-h{display:flex;align-items:center;gap:12px;padding:24px 24px 0}
.dlg-h h2{font-size:18px;font-weight:600;letter-spacing:-.02em}
.dlg-h .x{margin-left:auto;background:none;border:0;cursor:pointer;
          color:hsl(var(--muted-foreground));padding:5px;
          border-radius:calc(var(--radius) - 4px);display:flex}
.dlg-h .x:hover{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}
.dlg-h .x .icon{width:16px;height:16px}
.dlg-b{padding:16px 24px 24px;overflow-y:auto}
.dlg-b h3{font-size:13px;font-weight:600;color:hsl(var(--muted-foreground));
          margin:22px 0 10px}
.dlg-b h3:first-child{margin-top:0}
.dlg-b p{font-size:14px;line-height:1.6;color:hsl(var(--muted-foreground));
         margin-bottom:10px;max-width:70ch}
.dlg-b p.small{font-size:13px}
.dlg-b p b,.dlg-b p strong{color:hsl(var(--foreground));font-weight:600}
.formula{font:400 13px/1.5 var(--mono);background:hsl(var(--muted));
         border-radius:calc(var(--radius) - 2px);padding:10px 14px;margin:8px 0;
         color:hsl(var(--muted-foreground))}
.deflist{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;font-size:14px}
.deflist dt{color:hsl(var(--muted-foreground));white-space:nowrap}
.field{display:block;margin-bottom:16px}
.field span{display:block;font:500 14px var(--sans);margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;font:400 14px var(--sans);
  color:hsl(var(--foreground));background:transparent;height:36px;
  border:1px solid hsl(var(--input));border-radius:calc(var(--radius) - 2px);padding:0 12px}
.field textarea{height:auto;padding:9px 12px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;box-shadow:0 0 0 2px hsl(var(--background)),0 0 0 4px hsl(var(--ring))}
.msg{font:500 13px var(--sans);margin-top:12px}
.msg.err{color:hsl(var(--destructive))} .msg.ok{color:hsl(var(--opp-1))}

/* ═══ PRICE ══════════════════════════════════════════════════════════════════ */
.price{border:1px solid hsl(var(--border));border-radius:var(--radius);padding:22px;
       background:hsl(var(--muted)/.4)}
.price-top{display:flex;align-items:baseline;gap:10px;padding-bottom:16px;
           margin-bottom:16px;border-bottom:1px solid hsl(var(--border))}
.price-amt{font-size:40px;font-weight:700;letter-spacing:-.035em;line-height:1;
           color:hsl(var(--foreground))}
.price-per{font-size:13px;color:hsl(var(--muted-foreground))}
.price ul{list-style:none;font-size:14px}
.price li{display:flex;gap:10px;padding:6px 0;align-items:flex-start;
          color:hsl(var(--foreground))}
.price li .icon{width:15px;height:15px;margin-top:3px;color:hsl(var(--opp-1));flex:none}
.price li.no{color:hsl(var(--muted-foreground))}
.price li.no .icon{color:hsl(var(--muted-foreground))}

/* ═══ STATES ═════════════════════════════════════════════════════════════════ */
.empty{padding:64px 24px;text-align:center;background:hsl(var(--card));
       border:1px solid hsl(var(--border));border-radius:var(--radius)}
.empty h3{font-size:17px;font-weight:600;margin-bottom:8px}
.empty p{font-size:14px;color:hsl(var(--muted-foreground));max-width:46ch;margin:0 auto 18px}

      gap:16px;align-items:center}
.skel:last-child{border-bottom:0}

<body>
<!--
  THESIS: A tool a seller keeps open to decide what to launch — a dense, ranked
  instrument, not a page about trends. Refuses the metric-card-and-hero template.
  OWN-WORLD: Radix. A disciplined neutral scale on a dark ground, one iris accent
  reserved for interactive and selected states, bordered panels at 6/8px radii,
  Inter at 13px with tabular figures. Light supported, dark tuned.
  STORY: A seller scans the stat strip, filters by lens, reads the ranked table,
  opens one keyword, decides — and sees plainly what the trial does not include.
  FIRST VIEWPORT: Top bar, four stats including the honest score-accuracy figure,
  filter row, then the ranked table already legible. Primary action is the row.
  FORM: Radix — option A of three shown, chosen by the user over Geist and Linear.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the
  finish review, the verdict, and DESIGN.md.
-->

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<g id="i-search"><circle cx="7" cy="7" r="5"/><path d="M11 11l4 4"/></g>
<g id="i-up"><path d="M8 3v10M4 7l4-4 4 4"/></g>
<g id="i-down"><path d="M8 13V3M4 9l4 4 4-4"/></g>
<g id="i-flat"><path d="M3 8h10"/></g>
<g id="i-lock"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2"/></g>
<g id="i-star"><path d="M8 2.5l1.7 3.5 3.8.5-2.8 2.7.7 3.8L8 11.2l-3.4 1.8.7-3.8L2.5 6.5l3.8-.5z"/></g>
<g id="i-table"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M2.5 6.5h11M6.5 6.5V13"/></g>
<g id="i-grid"><rect x="2.5" y="3" width="4.5" height="4.5" rx="1"/><rect x="9" y="3" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="8.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="8.5" width="4.5" height="4.5" rx="1"/></g>
<g id="i-x"><path d="M4 4l8 8M12 4l-8 8"/></g>
<g id="i-check"><path d="M3 8.5l3.5 3.5L13 5"/></g>
<g id="i-info"><circle cx="8" cy="8" r="6"/><path d="M8 7.5v4M8 5.2v.1"/></g>
<g id="i-alert"><path d="M8 2.5l6 11H2z"/><path d="M8 6.5v3.2M8 11.6v.1"/></g>
<g id="i-user"><circle cx="8" cy="5.5" r="2.75"/><path d="M2.75 14c.6-2.9 2.7-4.4 5.25-4.4S12.65 11.1 13.25 14"/></g>
<g id="i-chart"><path d="M2.5 13.5V2.5M2.5 13.5h11"/><path d="M5 11l2.5-3.5L10 9l3-5"/></g>
<g id="i-note"><path d="M3.5 2.5h6L12.5 6v7.5h-9z"/><path d="M9.5 2.5V6h3"/></g>
<g id="i-arrow"><path d="M3 8h10M9.5 4.5L13 8l-3.5 3.5"/></g>
</defs></svg>

<header class="topbar">
  <div class="brand"><span class="mark"></span>TrendPulse</div>
  <nav class="tnav">
    <a class="on" href="/">Trends</a>
    <button onclick="openMovers()">Movers</button>
    <a href="/track-record">Track record</a>
    <button onclick="openMethods()">Methods</button>
  </nav>
  <div class="tright">
    <select class="sel" id="verticalSelect" onchange="setVertical(this.value)" title="Narrow to one vertical"></select>
    <span id="authSlot"></span>
  </div>
</header>

<main class="page">
  <div id="noticeSlot"></div>
  <div id="appContent">
    <div class="panel">
      <div class="skel"><i style="width:30%"></i><i style="width:8%;margin-left:auto"></i><i style="width:6%"></i></div>
      <div class="skel"><i style="width:24%"></i><i style="width:8%;margin-left:auto"></i><i style="width:6%"></i></div>
      <div class="skel"><i style="width:28%"></i><i style="width:8%;margin-left:auto"></i><i style="width:6%"></i></div>
      <div class="skel"><i style="width:20%"></i><i style="width:8%;margin-left:auto"></i><i style="width:6%"></i></div>
    </div>
  </div>
  <footer class="foot">
    <span>TrendPulse — nightly product trend tracking</span>
    <span id="colophonRun"></span>
    <a href="/track-record">Measured accuracy</a>
  </footer>
</main>

<dialog id="dlgKeyword"><div class="dlg" id="dlgKeywordBody"></div></dialog>
<dialog id="dlgGeneric"><div class="dlg" id="dlgGenericBody"></div></dialog>
<dialog id="dlgMethods"><div class="dlg" id="dlgMethodsBody"></div></dialog>
<script>
// ── State ─────────────────────────────────────────────────────────────────────
let allKeywords = [], activeCategory = 'All', activeLenses = new Set();
let activeSort = 'growth', viewMode = 'table', visibleCount = 60;
const PAGE_SIZE = 60;
let fetchedAt = null, verticalList = [], activeVertical = 'all';
let scoreBands = [], historyCoverage = null, signalSources = {}, factorWeights = {};
let currentUser = null, accountsEnabled = false, watchSet = new Set();
let plan = null, calibration = null, charts = {};

const DEFAULT_BANDS = [
  {min:75,label:'Strong opportunity'},{min:60,label:'Good potential'},
  {min:45,label:'Moderate risk'},{min:30,label:'High risk'},{min:0,label:'Not recommended'}];

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const normKw = s => String(s).trim().toLowerCase().replace(/\s+/g,' ');
const ic = (n, cls) => `<svg class="icon ${cls||''}" viewBox="0 0 16 16"><use href="#i-${n}"/></svg>`;
const calcViability = k => k.viability != null ? k.viability : 0;
const bandFor = v => (scoreBands.length ? scoreBands : DEFAULT_BANDS).find(b => v >= b.min) || DEFAULT_BANDS[4];
const limits = () => (plan && plan.limits) || {};
// Price is policy, served by plans.py — never a literal in the view.
const price = () => (plan && plan.price) || {display:'$9.99/mo', symbol:'$', amount:'9.99', interval:'month'};

// shadcn tokens are HSL triplets, so there are two accessors: *Token returns the
// bare `var(--x)` for CSS that wraps it (hsl(var(--cat)/.14)), *Color returns a
// finished colour for inline style.
function catToken(cat) {
  let h = 0; const t = String(cat || '');
  for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0;
  return `var(--c${(h % 12) + 1})`;
}
const catColor = cat => `hsl(${catToken(cat)})`;

// Opportunity band. Derived from the same band that produces the label, because
// the server's bands are calibrated and move.
function bandToken(v) {
  const bands = scoreBands.length ? scoreBands : DEFAULT_BANDS;
  let i = bands.findIndex(b => v >= b.min);
  if (i < 0) i = bands.length - 1;
  return `var(--opp-${Math.min(5, i + 1)})`;
}
const bandColor = v => `hsl(${bandToken(v)})`;

function growthClass(g) {
  return g >= 1000 ? 'growth-break' : g >= 200 ? 'growth-hot' : '';
}
// Reddit has returned 403 to unauthenticated search for the whole series, and the
// cache records that as 0 rather than null. A zero rendered as a measurement reads
// as "nobody is discussing this", which is the opposite of "we could not ask", so
// the signal is treated as unmeasured until any keyword actually carries a count.
let redditLive = false;
const hasReddit = k => redditLive && k.reddit_30d != null;
const canSeries = () => !!limits().series_in_list;

function fmtNum(n) {
  if (n == null) return '—';
  if (n >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'') + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'') + 'k';
  return String(Math.round(n));
}
function fmtGrowth(g) {
  if (g == null) return '—';
  if (g >= 5000) return '+5,000%+';
  if (g <= 0) return '—';
  return '+' + Math.round(g).toLocaleString() + '%';
}
function deltaHTML(v, suffix) {
  if (v == null) return '<span class="flat">—</span>';
  const cls = v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
  const arrow = v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
  const sign = v > 0 ? '+' : v < 0 ? '\u2212' : '';
  return `<span class="delta ${cls}">${ic(arrow)}${sign}${Math.abs(v)}${suffix||''}</span>`;
}
function sparkHTML(series, w, h) {
  const s = (series || []).filter(n => n != null);
  if (s.length < 2) return '';
  w = w || 74; h = h || 22;
  const max = Math.max(...s), min = Math.min(...s), span = (max - min) || 1;
  const pts = s.map((v, i) => [
    (i / (s.length - 1)) * (w - 2) + 1,
    h - 1 - ((v - min) / span) * (h - 2)
  ]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const rising = s[s.length - 1] >= s[0];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}"
    stroke="hsl(var(--${rising ? 'up' : 'down'}))"/></svg>`;
}

// ── Lenses ────────────────────────────────────────────────────────────────────
const LENSES = [
  {id:'viable', hue:'--opp-1',   icon:'check', label:'Viability 65+',   tip:'Strong conditions for a new product',
   test:k => calcViability(k) >= 65},
  {id:'breakout', hue:'--c11', icon:'up',    label:'Breakout',        tip:'1,000%+ 12-month growth',
   test:k => k.momentum === 'breakout' || k.status === 'breakout' || k.growth >= 1000},
  {id:'hot', hue:'--c2',      icon:'chart', label:'200–999% growth', tip:'Proven demand, still room to enter',
   test:k => (k.momentum === 'hot' || k.growth >= 200) && k.growth < 1000 && k.status !== 'flat'},
  {id:'amz_low_comp', hue:'--c7', icon:'table', label:'Low competition', tip:'Under 500 Amazon listings',
   test:k => k.amazon_result_count != null && k.amazon_result_count < 500},
  {id:'reddit', hue:'--c2',   icon:'user',  label:'Reddit 20+',      tip:'20+ mentions in 30 days',
   needs:'reddit', test:k => (k.reddit_30d || 0) >= 20},
  {id:'new', hue:'--c9',      icon:'star',  label:'Newly discovered', tip:'Added by the nightly discovery engine',
   test:k => !!k.is_new},
];

// ── Bootstrap ─────────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const json = await api('/api/trends');
    if (!json.ok) throw new Error(json.error || 'No data yet — the nightly job has not run.');
    allKeywords = json.keywords;
    fetchedAt = json.fetched_at ? new Date(json.fetched_at) : new Date();
    verticalList = json.verticals || []; activeVertical = json.vertical || 'all';
    scoreBands = json.bands || []; historyCoverage = json.history || null;
    signalSources = json.signal_sources || {}; factorWeights = json.factor_weights || {};
    plan = json.plan || null;
    redditLive = allKeywords.some(k => (k.reddit_30d || 0) > 0);
    api('/api/track-record').then(r => { if (r.ok) { calibration = r; renderAbstract(); } });
    renderShell();
    renderVerticalSelect();
    refreshAccount();
  } catch (err) { showError(err.message); }
}

function showError(msg) {
  document.getElementById('appContent').innerHTML =
    `<div class="empty"><h3>The series could not be loaded</h3>
     <p>${esc(msg)}</p>
     <p style="font-size:13px">Observations are published nightly at 1 AM CST.</p>
     <button class="btn" onclick="location.reload()">Retry</button></div>`;
}

// ── Dateline, abstract, notices ───────────────────────────────────────────────
function sourceSummary() {
  const nice = {google:'Google Trends', amazon:'Amazon', wikipedia:'Wikipedia',
                reddit:'Reddit', youtube:'YouTube', etsy:'Etsy', first_party:'first-party'};
  const out = ['Google Trends'];
  if (allKeywords.some(k => k.amazon_result_count != null)) out.push('Amazon');
  Object.entries(signalSources || {}).forEach(([k, v]) => { if (v) out.push(nice[k] || k); });
  if (redditLive) out.push('Reddit');
  return [...new Set(out)].join(' · ');
}

function renderDateline() {
  const d = fetchedAt, cr = document.getElementById('colophonRun');
  if (cr) cr.textContent = d
    ? 'Updated ' + d.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})
    : '';
}

function renderAbstract() {
  const el = document.getElementById('statsSlot');
  if (!el) return;
  const rising = allKeywords.filter(k => k.status !== 'flat').length;
  const brk    = allKeywords.filter(k => k.growth >= 1000).length;
  const days   = historyCoverage ? historyCoverage.snapshot_count : null;

  let acc = {v: '—', note: 'not yet measured', warn: false};
  if (calibration && calibration.factor_diagnostics && calibration.factor_diagnostics.score_then) {
    const c = calibration.factor_diagnostics.score_then;
    if (c.correlation != null) {
      acc = {v: c.correlation.toFixed(3),
             note: (c.correlation > 0 ? 'correlation, n=' : 'not predictive · n=') + c.n,
             warn: c.correlation <= 0};
    }
  }
  const card = (label, icon, value, sub, tone) => `
    <div class="stat">
      <div class="sh"><span>${label}</span>
        <span class="badge-i"${tone ? ` style="color:hsl(${tone})"` : ''}>${ic(icon)}</span></div>
      <b${tone ? ` style="color:hsl(${tone})"` : ''}>${value}</b>
      <em>${sub}</em>
    </div>`;
  el.innerHTML =
    card('Keywords tracked', 'table', allKeywords.length.toLocaleString(),
         `${allKeywords.length - rising} no longer climbing`, null) +
    card('Still climbing', 'up', rising.toLocaleString(),
         `${Math.round(rising / Math.max(1,allKeywords.length) * 100)}% of the series`, 'var(--opp-1)') +
    card('Breakouts', 'chart', brk,
         days ? `1,000%+ growth · ${days}d of history` : '1,000%+ growth', 'var(--opp-2)') +
    card('Score accuracy', 'alert', acc.v, acc.note,
         acc.warn ? 'var(--opp-4)' : 'var(--opp-1)');
}

function renderNotices() {
  const el = document.getElementById('noticeSlot');
  if (!el) return;
  const out = [];
  const p = plan || {};

  if (p.trialing) {
    const d = p.trial_days_left;
    out.push(`<div class="notice"><span>${ic('info')}</span>
      <div><b>Trial — ${d} day${d === 1 ? '' : 's'} remaining.</b>
      Full history, movers and trajectory are open until then.</div>
      <span class="sp"><button class="linkbtn" onclick="openUpgrade()">Subscribe — ${price().display} ${ic('arrow')}</button></span></div>`);
  } else if (p.trial_expired) {
    out.push(`<div class="notice flagged"><span>${ic('alert')}</span>
      <div><b>Your trial has ended.</b> Today's snapshot stays open;
      trajectory, movers and full history now need a subscription.</div>
      <span class="sp"><button class="linkbtn" onclick="openUpgrade()">Subscribe — ${price().display} ${ic('arrow')}</button></span></div>`);
  } else if (accountsEnabled && !currentUser) {
    out.push(`<div class="notice"><span>${ic('info')}</span>
      <div>You are reading the public series. A free account opens keyword
      trajectories and the movers table for 7 days — no card.</div>
      <span class="sp"><button class="linkbtn" onclick="openAuth('register')">Start trial ${ic('arrow')}</button></span></div>`);
  }
  el.innerHTML = out.join('');
}

// ── Shell ─────────────────────────────────────────────────────────────────────
function renderShell() {
  const cats = ['All', ...new Set(allKeywords.map(k => k.category))];
  document.getElementById('appContent').innerHTML = `
    <div class="stats" id="statsSlot"></div>
    <div class="toolbar">
      <div class="trow">
        <label class="search">${ic('search')}
          <input type="search" id="searchInput" placeholder="Search keywords"
                 oninput="visibleCount=PAGE_SIZE;renderRows()" aria-label="Search keywords">
        </label>
        <select class="sel" id="catSelect" onchange="setCategory(this.value)" aria-label="Category">
          ${cats.map(c => `<option value="${esc(c)}"${c===activeCategory?' selected':''}>${c==='All'?'All categories':esc(c)}</option>`).join('')}
        </select>
        <select class="sel" id="sortSelect" onchange="onSort(this.value)" aria-label="Sort by">
          <option value="growth">Growth</option>
          <option value="viability">Viability</option>
          <option value="score">Trend score</option>
          ${redditLive ? '<option value="reddit">Reddit volume</option>' : ''}
          <option value="az">A\u2013Z</option>
        </select>
        <div class="seg" role="group" aria-label="View">
          <button data-view="table" class="${viewMode==='table'?'on':''}" onclick="setView('table')">${ic('table')}Table</button>
          <button data-view="entry" class="${viewMode==='entry'?'on':''}" onclick="setView('entry')">${ic('grid')}Cards</button>
        </div>
        <span class="count" id="countSlot"></span>
      </div>
      <div class="trow lenses">
        ${LENSES.filter(l => l.needs !== 'reddit' || redditLive).map(l =>
          `<button class="lens${activeLenses.has(l.id)?' on':''}" title="${esc(l.tip)}"
           style="--lc:var(${l.hue})" onclick="toggleLens('${l.id}')">${ic(l.icon)}${esc(l.label)}</button>`).join('')}
        <button class="linkbtn" onclick="clearFilters()">Clear</button>
      </div>
    </div>
    <div id="rowsSlot"></div>`;
  document.getElementById('sortSelect').value = activeSort;
  renderDateline(); renderAbstract(); renderNotices(); renderRows();
}

// ── Filter / sort ─────────────────────────────────────────────────────────────
function getFiltered() {
  const q = (document.getElementById('searchInput')?.value || '').toLowerCase();
  const data = allKeywords.filter(k => {
    const mc = activeCategory === 'All' || k.category === activeCategory;
    const mq = !q || k.keyword.toLowerCase().includes(q) || k.category.toLowerCase().includes(q);
    const ml = activeLenses.size === 0 ? k.status !== 'flat'
      : [...activeLenses].every(id => (LENSES.find(l => l.id === id) || {test:()=>true}).test(k));
    return mc && mq && ml;
  });
  const sorts = {
    growth:(a,b)=>b.growth-a.growth, viability:(a,b)=>calcViability(b)-calcViability(a),
    score:(a,b)=>b.score-a.score, reddit:(a,b)=>(b.reddit_30d||0)-(a.reddit_30d||0),
    az:(a,b)=>a.keyword.localeCompare(b.keyword),
  };
  return data.sort(sorts[activeSort] || sorts.growth);
}
function setCategory(c){activeCategory=c;visibleCount=PAGE_SIZE;renderRows();}
function toggleLens(id){activeLenses.has(id)?activeLenses.delete(id):activeLenses.add(id);
  visibleCount=PAGE_SIZE;renderShellLenses();renderRows();}
function renderShellLenses(){
  const shown = LENSES.filter(l => l.needs !== 'reddit' || redditLive);
  document.querySelectorAll('.lenses .lens').forEach((b,i) =>
    b.classList.toggle('on', shown[i] && activeLenses.has(shown[i].id)));
}
function clearFilters(){activeLenses.clear();activeCategory='All';visibleCount=PAGE_SIZE;
  const s=document.getElementById('searchInput');if(s)s.value='';
  const c=document.getElementById('catSelect');if(c)c.value='All';
  renderShellLenses();renderRows();}
function onSort(v){activeSort=v;visibleCount=PAGE_SIZE;renderRows();}
function setView(m){if(viewMode===m)return;viewMode=m;
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.view===m));
  renderRows();}
function showMore(){visibleCount+=PAGE_SIZE;renderRows();}

// ── Rows ──────────────────────────────────────────────────────────────────────
function renderRows() {
  const data = getFiltered();
  const shown = data.slice(0, visibleCount);
  const cnt = document.getElementById('countSlot');
  if (cnt) cnt.textContent = `${shown.length.toLocaleString()} of ${data.length.toLocaleString()} shown`;
  const slot = document.getElementById('rowsSlot');
  if (!data.length) {
    slot.innerHTML = `<div class="empty"><h3>No keywords match</h3>
      <p>Every filter is combined, so narrow criteria can exclude everything.</p>
      <button class="btn" onclick="clearFilters()">Clear filters</button></div>`;
    return;
  }
  const sortLabel = {growth:'growth', viability:'viability', score:'trend score',
                     reddit:'Reddit volume', az:'name'}[activeSort] || 'growth';
  const body = viewMode === 'table' ? tableHTML(shown) : entriesHTML(shown);
  const more = shown.length < data.length
    ? `<div style="padding:14px;text-align:center;border-top:1px solid var(--border)">
         <button class="btn" onclick="showMore()">Show ${Math.min(PAGE_SIZE, data.length-shown.length)} more</button></div>`
    : '';
  const head = `<div class="ptop"><h2>Trends</h2>
      <span class="tag">Sorted by ${sortLabel}</span>
      ${canSeries() ? '' : '<span class="tag" style="margin-left:auto">7d \u00b7 30d locked</span>'}</div>`;
  slot.innerHTML = viewMode === 'table'
    ? `<div class="panel">${head}${body}${more}</div>${canSeries() ? '' : lockNote()}`
    : `${body}${more}${canSeries() ? '' : lockNote()}`;
}

function tableHTML(rows) {
  const locked = !canSeries();
  return `<div class="pscroll"><table class="data">
    <thead><tr>
      <th></th><th>Keyword</th>
      <th class="hide-sm">12-mo</th>
      <th>Growth</th>
      <th class="hide-md">Interest</th>
      <th class="hide-md">7d</th>
      <th class="hide-md">30d</th>
      <th class="hide-sm">Listings</th>
      <th>Viability</th>
    </tr></thead><tbody>
    ${rows.map(k => {
      const v = calcViability(k);
      const on = watchSet.has(normKw(k.keyword));
      const traj = locked
        ? `<span class="locked">${ic('lock')}</span>`
        : deltaHTML(k.d7);
      const traj30 = locked ? `<span class="locked">${ic('lock')}</span>` : deltaHTML(k.d30);
      return `<tr onclick="openKeyword('${esc(k.keyword).replace(/'/g,"\\'")}')">
        <td class="starcell"><button class="star${on?' on':''}" title="${on?'Remove from watchlist':'Add to watchlist'}"
            onclick="event.stopPropagation();toggleWatch('${esc(k.keyword).replace(/'/g,"\\'")}')">${ic('star')}</button></td>
        <td><div class="kw">${esc(k.keyword)}${k.is_new?'<span class="new">NEW</span>':''}</div>
            <div class="kw-sub"><span class="cdot" style="background:${catColor(k.category)}"></span>${esc(k.category)}</div></td>
        <td class="hide-sm">${sparkHTML(k.trend)}</td>
        <td class="u ${growthClass(k.growth)}">${fmtGrowth(k.growth)}</td>
        <td class="u hide-md">${k.score ?? '—'}</td>
        <td class="hide-md">${traj}</td>
        <td class="hide-md">${traj30}</td>
        <td class="u hide-sm">${fmtNum(k.amazon_result_count)}</td>
        <td><span class="score" style="color:${bandColor(v)}">${v}</span>
            <span class="meter"><i style="width:${v}%;background:${bandColor(v)}"></i></span></td>
      </tr>`;
    }).join('')}
    </tbody></table></div>`;
}

function lockNote() {
  return `<div class="notice" style="margin:14px 0 0">${ic('lock')}
    <div>Seven- and thirty-day movement comes from the tracked history.
    ${currentUser ? 'Subscribe to unlock it.' : 'A free 7-day trial unlocks it \u2014 no card required.'}</div>
    <span class="sp"><button class="btn sm pri" onclick="${currentUser?'openUpgrade()':"openAuth('register')"}">
      ${currentUser ? 'Subscribe \u2014 ' + price().display : 'Start free trial'}</button></span></div>`;
}

function entriesHTML(rows) {
  return `<div class="entries">${rows.map(k => {
    const v = calcViability(k), on = watchSet.has(normKw(k.keyword));
    return `<article class="entry" style="--cat:${catToken(k.category)}" onclick="openKeyword('${esc(k.keyword).replace(/'/g,"\\'")}')">
      <div class="entry-top"><div class="kw">${esc(k.keyword)}</div>
        <button class="star${on?' on':''}" onclick="event.stopPropagation();toggleWatch('${esc(k.keyword).replace(/'/g,"\\'")}')">${ic('star')}</button></div>
      <div class="kw-sub"><span class="cdot" style="background:${catColor(k.category)}"></span>${esc(k.category)}</div>
      <div class="entry-fig">${sparkHTML(k.trend, 240, 42)}</div>
      <dl>
        <dt>Growth</dt><dd class="${growthClass(k.growth)}">${fmtGrowth(k.growth)}</dd>
        <dt>Interest</dt><dd>${k.score ?? '—'}</dd>
        <dt>Listings</dt><dd>${fmtNum(k.amazon_result_count)}</dd>
        <dt>7-day</dt><dd>${canSeries() ? deltaHTML(k.d7) : `<span class="locked">${ic('lock')}</span>`}</dd>
        <dt>Viability</dt><dd style="color:${bandColor(v)};font-weight:600">${v} · ${esc(bandFor(v).label)}</dd>
      </dl></article>`;

}

// ── Dialogs ───────────────────────────────────────────────────────────────────
function openDlg(id, html) {
  document.getElementById(id + 'Body').innerHTML = html;
  const d = document.getElementById(id);
  if (!d.open) d.showModal();
}
function closeDlg(id) { const d = document.getElementById(id); if (d.open) d.close(); }
function dlgHead(title, id) {
  return `<div class="dlg-h"><h2>${title}</h2>
    <button class="x" onclick="closeDlg('${id}')" aria-label="Close">${ic('x')}</button></div>`;
}
document.addEventListener('click', e => {
  // Clicking the backdrop (the dialog element itself) closes it.
  if (e.target.tagName === 'DIALOG') e.target.close();
});

// ── Keyword detail ────────────────────────────────────────────────────────────
async function openKeyword(keyword) {
  const k = allKeywords.find(x => normKw(x.keyword) === normKw(keyword));
  if (!k) return;
  const v = calcViability(k), band = bandFor(v);
  const b = k.viability_breakdown || {};
  const on = watchSet.has(normKw(k.keyword));

  openDlg('dlgKeyword', dlgHead(esc(k.keyword), 'dlgKeyword') + `<div class="dlg-b">
    <div style="display:flex;gap:22px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px">
      <div><span style="font:700 34px var(--serif)">${v}</span>
           <span style="font-family:var(--sans);font-size:12px;color:var(--ink-3)">/100 viability</span></div>
      <div style="font-family:var(--sans);font-size:13px">${esc(band.label)}</div>
      <button class="btn ${on?'':'pri'}" style="margin-left:auto"
        onclick="toggleWatch('${esc(k.keyword).replace(/'/g,"\\'")}');closeDlg('dlgKeyword')">
        ${ic('star')}${on ? 'Watching' : 'Add to watchlist'}</button>
    </div>

    <h3>Twelve-month interest</h3>
    <div style="border:1px solid var(--rule);padding:10px">${sparkHTML(k.trend, 600, 90)}</div>

    <h3>Figures</h3>
    <dl class="deflist">
      <dt>Growth</dt><dd>${fmtGrowth(k.growth)} over twelve months</dd>
      <dt>Interest</dt><dd>${k.score ?? '—'} / 100 (relative index)</dd>
      <dt>Category</dt><dd>${esc(k.category)}</dd>
      <dt>Listings</dt><dd>${k.amazon_result_count == null ? 'Not collected for this keyword'
        : fmtNum(k.amazon_result_count) + ' on Amazon' + (
          k.amazon_avg_price != null ? `, $${k.amazon_avg_price.toFixed(2)} average` : '') + (
          k.amazon_avg_rating != null ? `, rated ${k.amazon_avg_rating.toFixed(1)}` : '')}</dd>
      <dt>Reddit</dt><dd>${hasReddit(k) ? fmtNum(k.reddit_30d) + ' posts / 30 days'
        : 'Unknown — not collected, see note 3'}</dd>
      ${k.amazon_best_seller ? '<dt>Flags</dt><dd>Best Seller present in results</dd>' : ''}
      ${k.amazons_choice ? "<dt>Flags</dt><dd>Amazon's Choice present in results</dd>" : ''}
    </dl>

    ${Object.keys(b).length ? `<h3>Score composition</h3><dl class="deflist">
      ${Object.entries(b).sort((x,y) => (x[0]==='bonus') - (y[0]==='bonus') || y[1]-x[1])
        .map(([key,val]) => `<dt>${esc(humanize(key))}</dt><dd>${val}</dd>`).join('')}
    </dl>` : ''}

    <h3>Tracked trajectory</h3>
    <div id="kwHistory">${canSeries()
      ? '<p class="small">Loading…</p>'
      : `<p class="small">The nightly trajectory for this keyword is part of the tracked
         history. ${currentUser ? 'It opens with a subscription.' : 'A free 7-day trial opens it — no card required.'}</p>
         <button class="btn pri" onclick="closeDlg('dlgKeyword');${currentUser?'openUpgrade()':"openAuth('register')"}">
         ${currentUser ? 'Subscribe — ${price().display}' : 'Start free trial'}</button>`}</div>

    ${currentUser ? `<h3>Your record</h3><div id="kwWorkspace"><p class="small">Loading…</p></div>`
                  : ''}
  </div>`);

  if (canSeries()) loadKeywordHistory(k.keyword);
  if (currentUser) loadKeywordWorkspace(k.keyword);
}

async function loadKeywordHistory(keyword) {
  const el = () => document.getElementById('kwHistory');
  const res = await api('/api/history/' + encodeURIComponent(keyword));
  if (!el()) return;
  if (res.status === 429) {
    el().innerHTML = `<p class="small">${esc(res.error)}</p>
      <button class="btn pri" onclick="closeDlg('dlgKeyword');openUpgrade()">Remove the limit — ${price().display}</button>`;
    return;
  }
  if (res.status === 401 || res.status === 402) {
    el().innerHTML = `<p class="small">${esc(res.error)}</p>
      <button class="btn pri" onclick="closeDlg('dlgKeyword');${res.status===401?"openAuth('register')":'openUpgrade()'}">
      ${res.status === 401 ? 'Start free trial' : 'Subscribe — ${price().display}'}</button>`;
    return;
  }
  if (!res.ok) { el().innerHTML = `<p class="small">${esc(res.error || 'No history recorded yet.')}</p>`; return; }
  const pts = (res.points || res.series || []);
  const vals = pts.map(p => p.viability ?? p.value ?? p.interest).filter(v => v != null);
  el().innerHTML = vals.length > 1
    ? `<div style="border:1px solid var(--rule);padding:10px">${sparkHTML(vals, 600, 90)}</div>
       <p class="small" style="margin-top:7px">${vals.length} nightly observations.</p>`
    : `<p class="small">Not enough observations yet.</p>`;
}

// ── Workspace (notes + outcome) ───────────────────────────────────────────────
const STAGES = ['considering','launched','passed'];
const RESULTS = ['too_early','flop','breakeven','worked','hit'];
const REVENUE = ['none','under_1k','1k_10k','10k_50k','50k_plus'];
const humanize = s => s.replace(/_/g,' ').replace(/^\w/, c => c.toUpperCase());

async function loadKeywordWorkspace(keyword) {
  const [note, out] = await Promise.all([
    api('/api/notes?keyword=' + encodeURIComponent(keyword)),
    api('/api/outcomes?keyword=' + encodeURIComponent(keyword)),
  ]);
  const el = document.getElementById('kwWorkspace');
  if (!el) return;
  const o = out.outcome || {};
  const sel = (id, opts, cur) => `<select id="${id}">
    <option value="">—</option>
    ${opts.map(v => `<option value="${v}"${v===cur?' selected':''}>${humanize(v)}</option>`).join('')}</select>`;
  el.innerHTML = `
    <p class="small">Recording what you actually did is what lets the backtest
       measure the score against real outcomes rather than only against interest.</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px">
      <label class="field"><span>Stage</span>${sel('wsStage', STAGES, o.stage)}</label>
      <label class="field"><span>Result</span>${sel('wsResult', RESULTS, o.result)}</label>
      <label class="field"><span>Revenue</span>${sel('wsRevenue', REVENUE, o.revenue_band)}</label>
    </div>
    <label class="field"><span>Notes</span>
      <textarea id="wsNote" rows="3" placeholder="What made you decide?">${esc((note.note||{}).body || '')}</textarea></label>
    <button class="btn pri" onclick="saveWorkspace('${esc(keyword).replace(/'/g,"\\'")}')">Save</button>
    <span class="msg" id="wsMsg"></span>`;
}

async function saveWorkspace(keyword) {
  const val = id => (document.getElementById(id) || {}).value || '';
  const msg = document.getElementById('wsMsg');
  msg.className = 'msg'; msg.textContent = 'Saving…';
  const stage = val('wsStage');
  if (stage) {
    const r = await api('/api/outcomes', {method:'POST', body: JSON.stringify({
      keyword, stage, result: val('wsResult') || null, revenue_band: val('wsRevenue') || null})});
    if (!r.ok) { msg.className='msg err'; msg.textContent = r.error || 'Could not save.'; return; }
  }
  const r2 = await api('/api/notes', {method:'POST', body: JSON.stringify({keyword, body: val('wsNote')})});
  if (!r2.ok) { msg.className='msg err'; msg.textContent = r2.error || 'Could not save the note.'; return; }
  msg.className = 'msg ok'; msg.textContent = 'Saved.';
}

// ── Movers ────────────────────────────────────────────────────────────────────
async function openMovers(win) {
  win = win || '7';
  const res = await api(`/api/movers?window=${win}`);
  if (res.status === 401 || res.status === 402) {
    openDlg('dlgGeneric', dlgHead('Movers', 'dlgGeneric') + `<div class="dlg-b">
      <p>${esc(res.error)}</p>
      <p class="small">Movers ranks every tracked keyword by how far it has moved since
         the last observation. It is derived entirely from the nightly history, which is
         why it sits behind the trial.</p>
      <button class="btn pri" onclick="closeDlg('dlgGeneric');${res.status===401?"openAuth('register')":'openUpgrade()'}">
        ${res.status === 401 ? 'Start free trial — no card' : 'Subscribe — ${price().display}'}</button></div>`);
    return;
  }
  if (!res.ok) {
    openDlg('dlgGeneric', dlgHead('Movers','dlgGeneric') +
      `<div class="dlg-b"><p>${esc(res.error || 'Not enough history yet.')}</p></div>`);
    return;
  }
  const tbl = rows => rows.length ? `<table class="data"><thead><tr>
      <th>Keyword</th><th>Category</th><th>Viability</th><th>Change</th></tr></thead><tbody>
      ${rows.slice(0,15).map(r => `<tr><td><div class="kw" style="font-size:15px">${esc(r.keyword)}</div></td>
        <td style="color:var(--ink-3)">${esc(r.category||'—')}</td>
        <td class="u">${r.viability}</td><td>${deltaHTML(r.delta)}</td></tr>`).join('')}
      </tbody></table>` : `<p class="small">Not enough history yet.</p>`;
  openDlg('dlgGeneric', dlgHead('Biggest movers','dlgGeneric') + `<div class="dlg-b">
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap">
      <div class="seg">${(res.available_windows||['7']).map(w =>
        `<button class="${w===win?'on':''}" onclick="openMovers('${w}')">${w} days</button>`).join('')}</div>
      <span class="count">${res.coverage} keywords with enough history</span></div>
    <h3>Rising</h3>${tbl(res.risers||[])}
    <h3>Cooling</h3>${tbl(res.fallers||[])}</div>`);
}

// ── Watchlist ─────────────────────────────────────────────────────────────────
async function openWatchlist() {
  const res = await api('/api/watchlist');
  const rows = res.watchlist || [];
  openDlg('dlgGeneric', dlgHead('Watchlist','dlgGeneric') + `<div class="dlg-b">
    ${rows.length ? `<table class="data"><thead><tr><th>Keyword</th><th>Viability</th>
        <th>7d</th><th>Since added</th><th>Band</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td><div class="kw" style="font-size:15px">${esc(r.keyword)}</div></td>
        <td class="u">${r.viability ?? '—'}</td><td>${deltaHTML(r.d7)}</td>
        <td>${deltaHTML(r.since_added)}</td>
        <td style="color:var(--ink-3)">${esc(r.band || '—')}</td></tr>`).join('')}
      </tbody></table>`
    : `<p>Nothing saved yet.</p><p class="small">Star a keyword in the table to follow it here
       and to see how it has moved since the day you added it.</p>`}</div>`);
}

// ── Subscription ──────────────────────────────────────────────────────────────
function openUpgrade() {

  openDlg('dlgGeneric', dlgHead('Subscription','dlgGeneric') + `<div class="dlg-b">

      <div class="price-top"><span class="price-amt">${price().symbol}${price().amount}</span>
        <span class="price-per">per month · cancel any time</span></div>

        ${li(true,'Full nightly trajectory for every tracked keyword')}

        ${li(true,'Unlimited keyword history (the trial allows 25 a day)')}

        ${li(true,'The current week&rsquo;s report, as it is published')}
      </ul>

    <p class="small" style="margin-top:16px">Billing is not connected yet, so this button

// ── Methods ───────────────────────────────────────────────────────────────────
function openMethods() {
  const red = !redditLive;
  openDlg('dlgMethods', dlgHead('Methods','dlgMethods') + `<div class="dlg-b">
    <h3>Collection</h3>
    <p>Every night at 1 AM CST a scheduled job queries each tracked keyword and appends
      the result to a snapshot store rather than overwriting the previous night. The web
      application only ever reads that store; nothing is fetched live.</p>
    <dl class="deflist">
      <dt>Google Trends</dt><dd>US interest-over-time across twelve months. A 0–100
        relative index, not a volume count.</dd>
      <dt>Amazon</dt><dd>First page of search results: listing count, average price,
        rating, review counts and Best Seller / Amazon&rsquo;s Choice flags.</dd>
      <dt>Wikipedia</dt><dd>Daily pageviews over 60 days — a real count, so it can tell a
        small category from a shrinking one.</dd>
      <dt>Reddit</dt><dd>${red ? 'Currently unavailable. Reddit returns 403 to unauthenticated search, so social demand is recorded as unknown — not as zero — and affected keywords carry lower confidence.' : 'Post volume over 30 days, with week-over-week velocity.'}</dd>
    </dl>

    <h3>Twelve-month growth</h3>
    <div class="formula">(recent_month − earliest_month) / earliest_month × 100</div>
    <p class="small">A keyword at index 10 in January and 50 in December shows +400%.</p>

    <h3>Viability</h3>
    <p>A 0–100 composite. Factors score only over the weight that actually has data, and
      the result is scaled by the share of total weight that represents — so a keyword
      measured on Google Trends alone cannot reach the top band, and a missing Amazon
      lookup no longer quietly earns a mid-table score.</p>
    ${Object.keys(factorWeights||{}).length ? `<dl class="deflist">
      ${Object.entries(factorWeights).map(([k,v]) =>
        `<dt>${v}</dt><dd>${esc(humanize(k))}</dd>`).join('')}</dl>` : ''}

    <h3>What this score is not</h3>
    <p>${calibration && calibration.factor_diagnostics && calibration.factor_diagnostics.score_then
        ? `Backtested against 30-day forward movement the composite correlates
           <b>${calibration.factor_diagnostics.score_then.correlation.toFixed(3)}</b>
           (n=${calibration.factor_diagnostics.score_then.n}). It is not predictive today.`
        : 'The score is backtested nightly against 30-day forward movement.'}
      The weights have deliberately not been re-fitted to that result — the sample is
      still small enough that doing so would fit noise. The full breakdown is public on
      the <a href="/track-record">track record</a> page.</p>
  </div>`);
}

// ── API + account ─────────────────────────────────────────────────────────────
async function api(path, opts) {
  const res  = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opts));
  const json = await res.json().catch(() => ({ok:false, error:'Unreadable response'}));
  return {status: res.status, ...json};
}

function renderVerticalSelect() {
  const sel = document.getElementById('verticalSelect');
  if (!sel || !verticalList.length) { if (sel) sel.style.display = 'none'; return; }
  sel.innerHTML = verticalList.map(v =>
    `<option value="${esc(v.id)}"${v.id===activeVertical?' selected':''}>${esc(v.label)}</option>`).join('');
}

async function setVertical(id) {
  activeVertical = id;
  const json = await api('/api/trends?vertical=' + encodeURIComponent(id));
  if (json.ok) {
    allKeywords = json.keywords; plan = json.plan || plan;
    visibleCount = PAGE_SIZE; activeCategory = 'All';
    renderShell(); renderVerticalSelect();
  }
}

async function refreshAccount() {
  const me = await api('/api/auth/me');
  accountsEnabled = !!me.accounts_enabled;
  currentUser = me.user || null;
  if (me.plan) plan = me.plan;
  if (currentUser) await refreshWatchlist();
  renderAuthSlot(); renderNotices(); renderRows();
}

function renderAuthSlot() {
  const slot = document.getElementById('authSlot');
  if (!slot) return;
  if (!accountsEnabled) { slot.innerHTML = ''; return; }
  slot.innerHTML = currentUser
    ? `<button class="linkbtn" onclick="openWatchlist()">${ic('star')}Watchlist</button>
       <button class="linkbtn" onclick="doLogout()" title="${esc(currentUser.email)}">Sign out</button>`
    : `<button class="linkbtn" onclick="openAuth('login')">${ic('user')}Sign in</button>`;
}

function openAuth(mode) {
  mode = mode || 'login';
  const reg = mode === 'register';
  openDlg('dlgGeneric', dlgHead(reg ? 'Start your trial' : 'Sign in', 'dlgGeneric') + `<div class="dlg-b">
    ${reg ? `<p>Seven days of the full series — trajectory, movers and keyword history.
      No card required, and nothing is charged when the trial ends.</p>` : ''}
    <label class="field"><span>Email</span>
      <input type="email" id="authEmail" autocomplete="username" placeholder="you@example.com"></label>
    <label class="field"><span>Password</span>
      <input type="password" id="authPass" placeholder="At least 10 characters"
        autocomplete="${reg?'new-password':'current-password'}"
        onkeydown="if(event.key==='Enter')doAuth('${mode}')"></label>
    <button class="btn pri" onclick="doAuth('${mode}')">${reg ? 'Start 7-day trial' : 'Sign in'}</button>
    <div id="authMsg" class="msg"></div>
    <p class="small" style="margin-top:16px;padding-top:14px;border-top:1px solid var(--rule)">
      ${reg ? 'Already have an account? <button class="linkbtn" style="color:var(--accent)" onclick="openAuth(\'login\')">Sign in</button>'
            : 'No account yet? <button class="linkbtn" style="color:var(--accent)" onclick="openAuth(\'register\')">Start a free trial</button>'}
      <br>There is no password reset yet — keep your password somewhere safe.</p>
  </div>`);
  setTimeout(() => { const e = document.getElementById('authEmail'); if (e) e.focus(); }, 30);
}

async function doAuth(mode) {
  const email = (document.getElementById('authEmail')||{}).value || '';
  const pass  = (document.getElementById('authPass') ||{}).value || '';
  const msg = document.getElementById('authMsg');
  msg.className = 'msg'; msg.textContent = 'Working…';
  const res = await api('/api/auth/' + (mode === 'login' ? 'login' : 'register'),
    {method:'POST', body: JSON.stringify({email, password: pass})});
  if (!res.ok) { msg.className = 'msg err'; msg.textContent = res.error || 'Something went wrong.'; return; }
  currentUser = res.user; plan = (res.user && res.user.plan) || plan;
  await refreshWatchlist();
  closeDlg('dlgGeneric');
  const t = await api('/api/trends' + (activeVertical ? '?vertical=' + encodeURIComponent(activeVertical) : ''));
  if (t.ok) { allKeywords = t.keywords; plan = t.plan || plan; }
  renderAuthSlot(); renderShell();
}

async function doLogout() {
  await api('/api/auth/logout', {method:'POST'});
  currentUser = null; watchSet = new Set();
  const t = await api('/api/trends');
  if (t.ok) { allKeywords = t.keywords; plan = t.plan || null; }
  renderAuthSlot(); renderShell();
}

async function refreshWatchlist() {
  const res = await api('/api/watchlist');
  watchSet = new Set((res.watchlist || []).map(w => normKw(w.keyword)));
}

async function toggleWatch(keyword) {
  if (!currentUser) { openAuth('register'); return; }
  const key = normKw(keyword);
  if (watchSet.has(key)) {
    await api('/api/watchlist?keyword=' + encodeURIComponent(keyword), {method:'DELETE'});
    watchSet.delete(key);
  } else {
    await api('/api/watchlist', {method:'POST', body: JSON.stringify({keyword})});
    watchSet.add(key);
  }
  renderRows();
}

loadData();
</script>
