name: Refresh Trend Cache

on:
  schedule:
    - cron: '0 7 * * *'   # Every day at 7 AM UTC = 1 AM CST
  workflow_dispatch:        # Also allows manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytrends requests beautifulsoup4 lxml

      - name: Fetch trends and write cache
        env:
          # Reddit blocks unauthenticated search; without these the social
          # signal is recorded as unknown rather than zero.
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TRENDPULSE_VERTICAL: ${{ vars.TRENDPULSE_VERTICAL }}
        run: python scripts/fetch_trends.py

      - name: Backtest the score against what actually happened
        run: python scripts/calibrate.py

      - name: Generate the weekly report
        run: python scripts/weekly_report.py

      - name: Commit updated cache
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/trends.json cache/keywords.json cache/calibration.json \
                  cache/history cache/signals static/reports
          git diff --cached --quiet || git commit -m "chore: refresh trend cache"
          git push
